<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول الإدارة</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <form class="card login" method="post">
    <h1 style="font-size:19px;margin-top:0">دخول لوحة الإدارة</h1>
    <label class="f">كلمة المرور
      <input type="password" name="password" autofocus required autocomplete="current-password">
    </label>
    {% if error %}<p style="color:var(--danger);margin:0 0 10px">{{ error }}</p>{% endif %}
    <button class="btn primary" style="width:100%">دخول</button>
    <p class="muted" style="margin-bottom:0"><a href="{{ url_for('index') }}">العودة إلى الخريطة</a></p>
  </form>
</body>
</html>
